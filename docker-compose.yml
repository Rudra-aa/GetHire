# GetHire — Docker Compose (Development)
# =========================================
# Orchestrates the complete GetHire development environment.
#
# Services:
#   frontend  — React + Vite (hot reload)
#   backend   — FastAPI + Uvicorn (hot reload)
#   mongo     — MongoDB 7
#   redis     — Redis 7
#
# Usage:
#   docker compose up --build          # First run
#   docker compose up                  # Subsequent runs (no rebuild)
#   docker compose down                # Stop all services
#   docker compose down -v             # Stop and remove volumes (⚠️ deletes data)
#   docker compose logs -f backend     # Follow backend logs
#   docker compose exec backend bash   # Open shell in backend container

name: gethire

# ── Shared Network ────────────────────────────────────────────────────────
networks:
  gethire_network:
    name: gethire_network
    driver: bridge

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: gethire_mongo_data
  redis_data:
    name: gethire_redis_data

# ── Services ──────────────────────────────────────────────────────────────
services:

  # ── MongoDB 7 ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: gethire_mongo
    restart: unless-stopped
    networks:
      - gethire_network
    ports:
      - "27017:27017"     # Expose to host for MongoDB Compass / mongosh
    volumes:
      - mongo_data:/data/db
      - mongo_data:/data/configdb
    environment:
      # In development, no auth is required.
      # Sprint 2 will add MONGO_INITDB_ROOT_USERNAME / PASSWORD.
      MONGO_INITDB_DATABASE: gethire
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis 7 ───────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: gethire_redis
    restart: unless-stopped
    networks:
      - gethire_network
    ports:
      - "6379:6379"       # Expose to host for redis-cli inspection
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: gethire_backend
    restart: unless-stopped
    networks:
      - gethire_network
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot reload — uvicorn --reload watches for changes
      - ./backend:/app:cached
      # Prevent the host's venv from shadowing the container's venv
      - /app/venv
    environment:
      # ── Application ──
      APP_NAME: GetHire
      APP_VERSION: "1.0.0"
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO

      # ── MongoDB ──
      # Use the Docker service name "mongo" as the host
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: gethire

      # ── Redis ──
      # Use the Docker service name "redis" as the host
      REDIS_URL: redis://redis:6379/0

      # ── CORS ──
      # Allow the Vite dev server to call the API
      CORS_ORIGINS: '["http://localhost:5173", "http://frontend:5173"]'

      # ── Ollama (Sprint 3) ──
      OLLAMA_BASE_URL: http://host.docker.internal:11434

      # ── Upload directory ──
      UPLOAD_DIR: /tmp/gethire/uploads
    env_file:
      - .env     # Load developer overrides (gitignored)
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── React Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gethire_frontend
    restart: unless-stopped
    networks:
      - gethire_network
    ports:
      - "5173:5173"
    volumes:
      # Mount source for Vite HMR
      - ./frontend:/app:cached
      # Prevent host's node_modules from shadowing container's node_modules
      - /app/node_modules
    environment:
      # Base URL is empty — Vite dev server proxies /api/* to the backend
      VITE_API_BASE_URL: ""
      NODE_ENV: development
      # Tell vite.config.ts which host to proxy /api/* to inside Docker
      VITE_BACKEND_HOST: backend
      # Force Vite to poll for file changes inside Docker (required on some hosts)
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
