services:
  - type: web
    name: gethire-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app","http://localhost:5173","http://localhost:3000"]'
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: gethire
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
